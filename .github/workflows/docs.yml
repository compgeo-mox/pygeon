name: Documentation
permissions:
  contents: read

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-docs:
    name: Build the documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        pip install .

    # the same build as Read the Docs, with any warning or broken reference an error
    - name: Build documentation
      run: make -C docs html
